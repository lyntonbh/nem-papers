
<script>
(function(){
  'use strict';
  // ============================================================ helpers
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmt(x,d){ if(typeof x!=='number') return x; return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }
  function list(a,d){ return '[' + a.map(function(v){return fmt(v,d);}).join(', ') + ']'; }
  function mean(a){ return a.reduce(function(s,v){return s+v;},0)/a.length; }
  function sd(a){ var m=mean(a); return Math.sqrt(mean(a.map(function(v){return (v-m)*(v-m);}))); }
  function corr(a,b){ var ma=mean(a),mb=mean(b),n=0,da=0,db=0; for(var i=0;i<a.length;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)*(a[i]-ma);db+=(b[i]-mb)*(b[i]-mb);} return n/Math.sqrt(da*db); }
  function softmax(s){ var m=Math.max.apply(null,s); var e=s.map(function(v){return Math.exp(v-m);}); var t=e.reduce(function(a,b){return a+b;},0); return e.map(function(v){return v/t;}); }
  function solveLS(H,y,lam){ // normal equations with ridge lam, Gaussian elimination
    var n=H.length,p=H[0].length,A=[],b=[];
    for(var i=0;i<p;i++){A.push([]);b.push(0);for(var j=0;j<p;j++){var s=0;for(var k=0;k<n;k++)s+=H[k][i]*H[k][j];A[i].push(s+(i===j?lam:0));}for(var k2=0;k2<n;k2++)b[i]+=H[k2][i]*y[k2];}
    for(var c=0;c<p;c++){var piv=c;for(var r=c+1;r<p;r++)if(Math.abs(A[r][c])>Math.abs(A[piv][c]))piv=r;var tmp=A[c];A[c]=A[piv];A[piv]=tmp;var tb=b[c];b[c]=b[piv];b[piv]=tb;for(var r2=c+1;r2<p;r2++){var f=A[r2][c]/A[c][c];for(var cc=c;cc<p;cc++)A[r2][cc]-=f*A[c][cc];b[r2]-=f*b[c];}}
    var x=new Array(p);for(var i2=p-1;i2>=0;i2--){var s2=b[i2];for(var j2=i2+1;j2<p;j2++)s2-=A[i2][j2]*x[j2];x[i2]=s2/A[i2][i2];}return x;
  }
  var V={};
  function setV(k,v){V[k]=v;}
  function fillV(){ document.querySelectorAll('[data-v]').forEach(function(el){ var k=el.getAttribute('data-v'); if(k in V) el.textContent=V[k]; else el.textContent='?'; }); }
  function table(id, head, rows){ var el=document.getElementById(id); if(!el)return; var s='<table class="ex"><thead><tr>'+head.map(function(h){return '<th class="num">'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'; rows.forEach(function(r){ s+='<tr>'+r.map(function(c){return '<td class="num">'+esc(c)+'</td>';}).join('')+'</tr>'; }); el.innerHTML=s+'</tbody></table>'; }

  // ============================================================ worked examples
  // --- metrics on the six-row series
  var Y=[60,80,120,300,90,70], F=[65,75,110,220,95,75];
  var E=Y.map(function(y,i){return y-F[i];});
  var absE=E.map(Math.abs), sqE=E.map(function(e){return e*e;});
  var MAE=mean(absE), MSE=mean(sqE), RMSE=Math.sqrt(MSE);
  var ape=absE.map(function(e,i){return e/Math.abs(Y[i]);});
  var MAPE=100*mean(ape), RMSPE=100*Math.sqrt(mean(E.map(function(e,i){return (e/Y[i])*(e/Y[i]);})));
  var ybar=mean(Y), fbar=mean(F), nMAPE=100*MAE/ybar;
  var r=corr(Y,F), alpha=sd(F)/sd(Y), beta=fbar/ybar, kgedist=Math.sqrt((r-1)*(r-1)+(alpha-1)*(alpha-1)+(beta-1)*(beta-1)), KGE=1-kgedist;
  table('t-errors',['Half-hour','Actual y (A$/MWh)','Forecast ŷ','Error e = y − ŷ'],Y.map(function(y,i){return ['17:'+(i<2?'00':'30').slice(0,2)+'', y, F[i], E[i]];}).map(function(row,i){ var times=['17:00','17:30','18:00','18:30','19:00','19:30']; row[0]=times[i]; return row; }));
  setV('m.abse',list(absE,0)); setV('m.mae',fmt(MAE,2)); setV('m.sqe',list(sqE,0)); setV('m.mse',fmt(MSE,1)); setV('m.rmse',fmt(RMSE,2)); setV('m.rmseratio',fmt(RMSE/MAE,2));
  setV('m.ape',list(ape,3)); setV('m.mape',fmt(MAPE,1)); setV('m.rmspe',fmt(RMSPE,1)); setV('m.ybar',fmt(ybar,1)); setV('m.nmape',fmt(nMAPE,1)); setV('m.fbar',fmt(fbar,1));
  // near-zero variant: replace last row with actual 1, forecast 6
  var Y0=Y.slice(0,5).concat([1]), F0=F.slice(0,5).concat([6]); var E0=Y0.map(function(y,i){return y-F0[i];});
  setV('m.mape_zero',fmt(100*mean(E0.map(function(e,i){return Math.abs(e)/Math.abs(Y0[i]);})),0)); setV('m.nmape_zero',fmt(100*mean(E0.map(Math.abs))/mean(Y0),1));
  setV('m.r',fmt(r,3)); setV('m.r2',fmt(r*r,3)); setV('m.r_half',fmt(corr(Y,F.map(function(v){return v/2;})),3));
  setV('m.sdy',fmt(sd(Y),1)); setV('m.sdf',fmt(sd(F),1)); setV('m.alpha',fmt(alpha,3)); setV('m.alphapct',fmt(100*alpha,0)); setV('m.beta',fmt(beta,3)); setV('m.kgedist',fmt(kgedist,3)); setV('m.kge',fmt(KGE,3));
  // RevIN
  var z=Y.map(function(v){return (v-ybar)/sd(Y);}); setV('rv.z',list(z,2)); setV('rv.back',fmt(0.5*sd(Y)+ybar,1));
  // --- DM test
  var A=[10,30,5,120,20,15,8,25], B=[12,25,9,90,30,10,14,20]; var D=A.map(function(a,i){return a-B[i];}); var dm=mean(D), dsd=Math.sqrt(D.map(function(d){return (d-dm)*(d-dm);}).reduce(function(a,b){return a+b;},0)/(D.length-1)), dse=dsd/Math.sqrt(D.length);
  setV('dm.a',list(A,0)); setV('dm.b',list(B,0)); setV('dm.d',list(D,0)); setV('dm.mean',fmt(dm,2)); setV('dm.sd',fmt(dsd,2)); setV('dm.se',fmt(dse,2)); setV('dm.stat',fmt(dm/dse,2));
  // --- neuron
  var s=0.3*1.2+0.8*1.5-0.2; setV('nn.sum',fmt(s,2)); setV('nn.relu',fmt(Math.max(0,s),2)); setV('nn.tanh',fmt(Math.tanh(s),3)); setV('nn.sig',fmt(1/(1+Math.exp(-s)),3)); setV('nn.out',fmt(100*Math.max(0,s),0));
  // --- pinball
  setV('pin.low',fmt(0.9*20,0)); setV('pin.high',fmt(0.1*20,0));
  // --- CNN
  var cx=[60,62,65,80,120,200,150,90], ck=[-1,0,1], cy=[]; for(var i=1;i<cx.length-1;i++) cy.push(ck[0]*cx[i-1]+ck[1]*cx[i]+ck[2]*cx[i+1]);
  var crelu=cy.map(function(v){return Math.max(0,v);}); var cpool=[]; for(var j=0;j<crelu.length;j+=2) cpool.push(Math.max(crelu[j],crelu[j+1]!==undefined?crelu[j+1]:-Infinity));
  setV('cnn.x',list(cx,0)); setV('cnn.y',list(cy,0)); setV('cnn.relu',list(crelu,0)); setV('cnn.pool',list(cpool,0));
  // --- LSTM
  var c1=0.9*0.6, c2=0.5*0.8, c=c1+c2, h=0.7*Math.tanh(c); setV('lstm.c1',fmt(c1,2)); setV('lstm.c2',fmt(c2,2)); setV('lstm.c',fmt(c,2)); setV('lstm.tanhc',fmt(Math.tanh(c),3)); setV('lstm.h',fmt(h,3)); setV('lstm.calt',fmt(0.1*0.6+0.4,2));
  // --- autoencoder
  var noise=[3,-4,6,-9,2,-3]; setV('ae.noisy',list(Y.map(function(v,i){return v+noise[i];}),0)); setV('ae.clean',list(Y,0));
  // --- RVFL
  var rx=[0.5,0.7,0.9,1.2,1.6,2.2,3.0,0.8], ry=[0.6,0.75,1.0,1.4,1.5,1.9,2.4,0.9]; var w1=1.3,b1=-1.6,w2=-0.9,b2=1.2;
  var H=rx.map(function(x){return [1,x,Math.tanh(w1*x+b1),Math.tanh(w2*x+b2)];}); var beta_=solveLS(H,ry,0.01); var fit=H.map(function(row){return row.reduce(function(s,v,i){return s+v*beta_[i];},0);});
  var rmae=mean(fit.map(function(f,i){return Math.abs(f-ry[i]);}));
  table('t-rvfl',['Row','x (price now ÷100)','tanh(w₁x+b₁)','tanh(w₂x+b₂)','target y','fitted ŷ'],rx.map(function(x,i){return [i+1,fmt(x,2),fmt(H[i][2],3),fmt(H[i][3],3),fmt(ry[i],2),fmt(fit[i],2)];}));
  setV('rvfl.w1',w1); setV('rvfl.b1',b1); setV('rvfl.w2',w2); setV('rvfl.b2',b2); setV('rvfl.beta',list(beta_,2)); setV('rvfl.mae',fmt(rmae,3)); setV('rvfl.mae100',fmt(100*rmae,0));
  // --- softmax
  var ss=[2,1,0.1], se=ss.map(Math.exp), sw=softmax(ss); setV('sm.exp',list(se,3)); setV('sm.sum',fmt(se.reduce(function(a,b){return a+b;},0),3)); setV('sm.w',list(sw,3)); setV('sm.w3',list(softmax(ss.map(function(v){return 3*v;})),3));
  // --- attention
  var q=[1.0,0.5], K=[[0.9,0.6],[0.7,0.2],[-0.8,0.3]], Vv=[2.6,1.4,0.4]; var sc=K.map(function(k){return (q[0]*k[0]+q[1]*k[1])/Math.sqrt(2);}); var aw=softmax(sc); var ao=aw.reduce(function(s,w,i){return s+w*Vv[i];},0);
  setV('at.q',list(q,1)); setV('at.k1',list(K[0],1)); setV('at.k2',list(K[1],1)); setV('at.k3',list(K[2],1)); setV('at.v',list(Vv,1)); setV('at.s',list(sc,3)); setV('at.w',list(aw,3)); setV('at.out',fmt(ao,3)); setV('at.out100',fmt(100*ao,0));
  // --- patches, lora
  setV('pt.n',(96-24)/6+1); var full=4096*4096, lora=2*4096*8; setV('lora.full',full.toLocaleString()); setV('lora.lora',lora.toLocaleString()); setV('lora.pct',fmt(100*lora/full,2));
  // --- RL toy
  var P=[50,300,40], Fc=[50,45,140]; setV('rl.p',list(P,0)); setV('rl.f',list(Fc,0)); setV('rl.buy','interval 1 (A$50)'); setV('rl.sell','interval 2 (A$300)'); setV('rl.pio',fmt(P[1]-P[0],0)); setV('rl.fpred',fmt(Fc[2]-Fc[1],0)); setV('rl.fact',fmt(P[2]-P[1],0));
  // --- covariate table
  (function(){ var el=document.getElementById('t-cov'); if(!el)return; var rows=[
    ['RRP (price)','yes, 48 h','no: this is the target','the target'],
    ['Demand','yes','yes: AEMO pre-dispatch demand','future known'],
    ['Net interchange','yes','yes: pre-dispatch flows','future known'],
    ['Temperature, cloud, humidity, wind','yes (observed)','yes: Open-Meteo forecast','future known'],
    ['Workday, half-hour / weekday / month sin-cos','yes','yes (calendar is known)','future known'],
    ['Hours to delivery','n/a','yes','future known'],
    ['AEMO pre-dispatch RRP, all regions','yes (past runs)','yes: the current run','future known, dominant']];
    var s='<table><thead><tr><th>Variable</th><th>Available for the past 96 steps (encoder)?</th><th>Available for the next 32 steps (decoder)?</th><th>Kind</th></tr></thead><tbody>'; rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}); el.innerHTML=s+'</tbody></table>'; })();
  // --- Haar wavelet
  var hx=[60,70,65,75,300,80,70,60]; var a1=[],d1=[]; for(var i3=0;i3<hx.length;i3+=2){a1.push((hx[i3]+hx[i3+1])/2);d1.push((hx[i3]-hx[i3+1])/2);} var a2=[],d2=[]; for(var i4=0;i4<a1.length;i4+=2){a2.push((a1[i4]+a1[i4+1])/2);d2.push((a1[i4]-a1[i4+1])/2);}
  var ma1=hx.map(function(v,i){var prev=hx[(i-1+hx.length)%hx.length];return (v+prev)/2;}), md1=hx.map(function(v,i){var prev=hx[(i-1+hx.length)%hx.length];return (v-prev)/2;});
  setV('hw.x',list(hx,0)); setV('hw.a1',list(a1,1)); setV('hw.d1',list(d1,1)); setV('hw.a2',list(a2,2)); setV('hw.d2',list(d2,2)); setV('hw.ma1',list(ma1,1)); setV('hw.md1',list(md1,1));
  fillV();

  // ============================================================ diagram helpers
  function flow(id, steps, opt){
    var el=document.getElementById(id); if(!el) return;
    opt = opt || {};
    var W = opt.w || 168, Hh = opt.h || 60, GAP = opt.gap || 42, PGAP = 10, PAD = 12;
    var cols = steps.map(function(st){ return st.par ? st.par : [st]; });
    var maxRows = Math.max.apply(null, cols.map(function(c){return c.length;}));
    var totalH = maxRows*Hh + (maxRows-1)*PGAP + 2*PAD + (opt.extraH||0);
    var totalW = cols.length*W + (cols.length-1)*GAP + 2*PAD;
    var s = '<svg viewBox="0 0 '+totalW+' '+totalH+'" width="'+totalW+'" height="'+totalH+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">';
    s += '<defs><marker id="ah'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>';
    var centers = [];
    cols.forEach(function(col, ci){
      var colH = col.length*Hh + (col.length-1)*PGAP;
      var y0 = PAD + (maxRows*Hh + (maxRows-1)*PGAP - colH)/2;
      var x = PAD + ci*(W+GAP);
      var cs = [];
      col.forEach(function(n, ri){
        var y = y0 + ri*(Hh+PGAP);
        var cls = 'box-'+(n.k||'model');
        s += '<rect x="'+x+'" y="'+y+'" width="'+W+'" height="'+Hh+'" rx="8" class="'+cls+'" stroke="rgba(0,0,0,.18)"'+(n.dash?' stroke-dasharray="4 3"':'')+(n.grey?' opacity="0.35"':'')+'/>';
        var lines = n.s || [];
        var ty = y + 18;
        s += '<text x="'+(x+W/2)+'" y="'+ty+'" text-anchor="middle" class="ti">'+esc(n.t)+'</text>';
        lines.forEach(function(l,i){ s += '<text x="'+(x+W/2)+'" y="'+(ty+14*(i+1))+'" text-anchor="middle" class="ts">'+esc(l)+'</text>'; });
        cs.push({x:x, y:y+Hh/2, r:x+W});
      });
      centers.push(cs);
    });
    for (var i=0;i<centers.length-1;i++){
      centers[i].forEach(function(a){ centers[i+1].forEach(function(b){
        var x1=a.r, y1=a.y, x2=b.x-2, y2=b.y, mx=(x1+x2)/2;
        s += '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ah'+id+')"/>';
      });});
    }
    if (opt.extra) s += opt.extra(totalW,totalH,centers);
    s += '</svg>';
    el.innerHTML = s;
  }
  function svg(id, w, h, body){ var el=document.getElementById(id); if(!el)return; el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:6px auto"><defs><marker id="ah-'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>'+body+'</svg>'; }
  function arr(id){ return 'marker-end="url(#ah-'+id+')"'; }
  function series(n, f){ var a=[]; for(var i=0;i<n;i++) a.push(f(i)); return a; }
  function path(pts, x0, y0, dx, sy, stroke, w){ var d=pts.map(function(v,i){return (i?'L':'M')+(x0+i*dx)+' '+(y0-v*sy);}).join(' '); return '<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+(w||1.6)+'"/>'; }
  function txt(x,y,t,cls,anchor,extra){ return '<text x="'+x+'" y="'+y+'" class="'+(cls||'ts')+'" text-anchor="'+(anchor||'start')+'" '+(extra||'')+'>'+esc(t)+'</text>'; }
  function blk(x,y,w,h,cls,t,s){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" class="'+cls+'" stroke="rgba(0,0,0,.18)"/>'+txt(x+w/2,y+(s?20:h/2+4),t,'ti','middle')+(s?txt(x+w/2,y+36,s,'ts','middle'):''); }

  // ============================================================ Part 1 diagrams
  // setup
  (function(){ var b='', x0=20, y=70, cw=36; var labels=['14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];
    for(var i=0;i<8;i++){ var x=x0+i*(cw+6); var past=i<4; b+='<rect x="'+x+'" y="'+y+'" width="'+cw+'" height="30" rx="5" class="'+(past?'box-input':'box-out')+'" stroke="rgba(0,0,0,.15)"'+(past?'':' opacity="0.5"')+'/>'; b+=txt(x+cw/2,y+19,labels[i],'ts','middle'); }
    b+='<line x1="'+(x0+4*(cw+6)-3)+'" y1="40" x2="'+(x0+4*(cw+6)-3)+'" y2="180" stroke="#6d5bd0" stroke-width="2" stroke-dasharray="5 3"/>'; b+=txt(x0+4*(cw+6)-3,34,'forecast origin: now (16:00)','ts','middle','fill="#5b21b6"');
    b+=txt(x0+2*(cw+6),60,'lags: past prices (known)','ts','middle'); b+=txt(x0+6*(cw+6),60,'targets: unknown prices','ts','middle');
    for(var j=4;j<8;j++){ var x2=x0+j*(cw+6); b+='<rect x="'+x2+'" y="115" width="'+cw+'" height="30" rx="5" class="box-input" stroke="rgba(0,0,0,.15)"/>'; b+=txt(x2+cw/2,134,'PD','ts','middle'); }
    b+=txt(x0+6*(cw+6)-30,165,'known-future covariates (pre-dispatch, weather fc, calendar)','ts','middle');
    for(var k=0;k<4;k++){ var x3=x0+k*(cw+6); b+='<rect x="'+x3+'" y="115" width="'+cw+'" height="30" rx="5" class="box-input" stroke="rgba(0,0,0,.15)"/>'; b+=txt(x3+cw/2,134,'obs','ts','middle'); }
    b+=txt(x0+2*(cw+6)+20,165,'past covariates (observed weather, demand)','ts','middle');
    svg('d-setup',420,185,b); })();
  // split
  (function(){ var b='', x0=20, W=560; var tr=0.75, va=0.05;
    b+='<rect x="'+x0+'" y="20" width="'+(W*tr)+'" height="26" class="box-model"/>'+txt(x0+W*tr/2,37,'train 37,085 (Nov 2022 → ~Dec 2024)','ts','middle');
    b+='<rect x="'+(x0+W*tr)+'" y="20" width="'+(W*va)+'" height="26" class="box-prep"/>'+txt(x0+W*tr+W*va/2,37,'val','ts','middle');
    b+='<rect x="'+(x0+W*(tr+va))+'" y="20" width="'+(W*(1-tr-va))+'" height="26" class="box-out"/>'+txt(x0+W*(tr+va)+W*(1-tr-va)/2,37,'test 9,858','ts','middle');
    b+=txt(x0,66,'walk-forward folds used to choose hyperparameters:','ts');
    for(var f=0;f<5;f++){ var y=76+f*20; var end=W*tr*(0.45+0.11*f); b+='<rect x="'+x0+'" y="'+y+'" width="'+end+'" height="14" class="box-model" opacity="0.8"/>'; b+='<rect x="'+(x0+end)+'" y="'+y+'" width="'+(W*tr*0.11)+'" height="14" class="box-prep"/>'; b+=txt(x0+end+W*tr*0.11+6,y+11,'fold '+(f+1),'ts'); }
    svg('d-split',600,185,b); })();
  // leak
  (function(){ var n=30, x0=20, y0=80, dx=11; var sig=series(n,function(i){return 0.5+0.35*Math.sin(i/3)+(i===18?0.9:0);}); var b=path(sig,x0,y0,dx,50,'#1f2937',1.6);
    var t=12; b+='<rect x="'+(x0+(t-2)*dx-4)+'" y="20" width="'+(5*dx)+'" height="80" rx="6" fill="rgba(109,91,208,.15)" stroke="#6d5bd0"/>';
    b+='<line x1="'+(x0+t*dx)+'" y1="20" x2="'+(x0+t*dx)+'" y2="110" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>'; b+=txt(x0+t*dx,120,'t (forecast origin)','ts','middle','fill="#991b1b"');
    b+=txt(x0+t*dx+3*dx,16,'t+1, t+2 used by the filter','ts','middle','fill="#5b21b6"'); b+=txt(x0,140,'smoothed(t) = mean(x[t−2] … x[t+2]) → the input already knows the future','ts');
    svg('d-leak',400,150,b); })();
  // KGE 3D-ish
